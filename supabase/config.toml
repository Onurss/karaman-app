project_id = "karaman-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["karaman://", "https://karaman.com"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

[experimental]
orioledb_version = ""

# Auth köprüsü: çağıran Supabase JWT'si değil, karaman token'ı taşır.
# Yetki fonksiyon içinde karaman /auth/me doğrulamasıyla sağlanır.
[functions.bridge-session]
enabled = true
verify_jwt = false

# Ödeme webhook'ları: dış sağlayıcı (iyzico/Garanti) çağırır, Supabase JWT taşımaz.
# Doğrulama fonksiyon içinde HMAC/hash imzasıyla yapılır → verify_jwt kapalı olmalı.
[functions.iyzico-webhook]
enabled = true
verify_jwt = false

[functions.garanti-webhook]
enabled = true
verify_jwt = false
